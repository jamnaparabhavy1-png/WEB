    <style>
        body {
            background-color: #E35336;
        }

        a {
            text-decoration: none;
        }

        .card {
            width: 370px;
            height: 610px;
            border: 1px solid black;
            align-items: center;
            text-align: center;
            border-radius: 20px;
            background-color: #F5F5DC;
            margin: 20px;
        }

        img {
            width: 330px;
            margin-top: 30px;
            height: 300px;
            border-radius: 10px 10px 0px 0px;
        }

        .text {
            background-color: #A0522D;
            width: 330px;
            align-items: center;
            text-align: center;
            justify-content: center;
            margin-left: 20px;
            height: 260px;
            margin-top: -25px;
            border-radius: 0px 0px 10px 10px;
        }
        .content{
            display: flex;
            justify-content: space-evenly;
        }
        .card:hover{
            transform: translateY(10px);
        }
        h2 {
            text-align: center;
        }
        h1 {
            text-align: center;
        }
        nav {
            display: flex;
        }
         a:hover {
            background-color: aqua;
            color: red;
        }

        a:visited {
            color: yellow;
        }
        ul{
            display: flex;
            gap: 20px;
            justify-content: center;
            text-align: center;
            align-items: center;
        }
        h3{
            text-align: center;
        }
        p{
            text-align: center;
        }
        button{
            width: 200px;
            height: 40px;
            background:linear-gradient(90deg,pink,lightblue);
            transition: all 0.5s ease;
        }
        button:hover{
            background: linear-gradient(270deg,pink,lightblue);
        }

    </style>
</head>
