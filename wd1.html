<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB PAGE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-image: url(./ChatGPT\ Image\ Sep\ 17\,\ 2026\,\ 05_32_18\ PM.png);
            background-repeat: no-repeat;
            background-size: cover;
            animation-name: color;
            animation-duration: 5s;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            position: relative;
            align-content: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            color: white;
        }

        nav {
            display: flex;
            gap: 30px;
            margin-left: 80px;
            color: black;
        }

        .right {
            display: flex;
            gap: 15px;
        }

        .b1 {
            height: 40px;
            border-radius: 30px;
            width: 150px;
            border: 1px solid white;
        }

        .b2 {
            height: 40px;
            width: 40px;
            border: 1px solid white;
            border-radius: 40px;
        }

        .drop {
            border: 1px solid white;
            height: 25px;
            width: 50px;
            text-align: center;
            border-radius: 10px;
            padding-bottom: 20px;
            color: white;

        }

        .middle {
            height: 50px;
            width: 500px;
            border-radius: 50px;
            background-color: white;
            margin-right: 300px;
        }

        .text2 {
            font-size: 50px;
            color: white;
            margin-top: 450px;
        }

        .left {
            color: white;
            width: 600px;
        }

        .t {
            display: flex;
            gap: 30px;
        }

        .text3 {
            margin-top: 15px;
            color: gray;
        }

        .text4 {
            margin-top: 15px;
        }

        .unique {
            color: gray;
        }

        .b3 {
            height: 50px;
            width: 50px;
            background-color: white;
            border-radius: 50px;
            border: 1px solid white;
            position: absolute;
            bottom: 160px;
            right: 330px;
        }

        .main {
            display: flex;
            justify-content: space-between;
        }

        .right1 {
            margin-top: 250px;
            text-align: right;
        }

        .upper {
            margin-right: 70px;
        }
        .animation{
            display: flex;
            justify-content: center;
            align-content: center;
            margin-top: 300px;
        }

        .ani::after {
            content: "AWSND";
            animation-name: color;
            animation-duration: 5s;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            position: relative;
            align-content: center;
            font-size: 70px;
            color: white;
        }
        .box{
            margin-top: 10px;
            animation-name: box;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            height: 60px;
            width: 20px;
            border: 1px solid black;
            position: relative;
            animation-duration: 5s;
            text-align: center;
        }

        @keyframes color {
            0% {
                content: "A";
            }

            25% {
                content: "AW";
            }

            50% {
                content: "AWS";
            }

            75% {
                content: "AWSN";
            }

            100% {
                content: "AWSND";
            }


        }
        @keyframes box {
            0% {
                background-color: red;
            }

            25% {
                background-color: blue;
            }

            50% {
               background-color: yellow;
            }

            75% {
                background-color: purple;
            }

            100% {
                background-color: white;
            }


        }
    </style>
</head>

<body>
    <header>

    <div class="animation">

    </div>
    <div class="main">
        <div class="left">
            <p class="text2">WE CREATE <i class="fa-solid fa-circle-arrow-down"></i><B>AWESOME DESIGN</B></p>
            <hr>
            <div class="t">
                <p>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    4.9
                </p>
                <div class="text3">Gold Verified</div>
                <div class="text4">our customers love to work with us, 40 Reviws</div>
            </div>
        </div>
        <div class="right1">
            <div class="upper">
                <div class="unique">Home</div>
                <br>
                <div class="a7">Our Service</div>
                <br>
                <div class="a7">About us</div>

                <br>
                <div class="a7">Portfolio</div>

                <br>
                <div class="a7">Reviews</div>

                <br>
                <div class="a7">Contact us</div>

                <br><br>
            </div>
            <img src="./images (1).jpg" alt="" style="height: 200px; width: 350px; border-radius: 20px;">
            <button class="b3"><i class="fa-solid fa-play"></i></button>
        </div>
    </div>
</body>

</html>
